<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | 学習クイズアプリ</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 24px;
        }

        .auth-card {
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .auth-card button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 16px;
            min-height: 1.5em;
        }

        .auth-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>ログイン</h1>

            <div class="auth-field">
                <label for="email">メールアドレス</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required>
            </div>

            <div class="auth-field">
                <label for="password">パスワード</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required>
            </div>

            <button id="loginBtn" type="button">
                ログイン
            </button>

		<p>
		    <a href="forgot-password.html">
		        パスワードを忘れた方はこちら
		    </a>
		</p>

            <div id="message" class="auth-message"></div>

            <div class="auth-link">
                アカウントを持っていない方は
                <a href="register.html">新規登録</a>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        const loginBtn =
            document.getElementById("loginBtn");

        const message =
            document.getElementById("message");

        loginBtn.addEventListener(
            "click",
            async () => {

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                if (!email || !password) {
                    message.textContent =
                        "メールアドレスとパスワードを入力してください。";
                    return;
                }

                message.textContent = "ログイン中...";

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    message.textContent =
                        "ログインに失敗しました: " +
                        error.message;
                    return;
                }

                if (data.session) {
                    window.location.replace("index.html");
                }
            }
        );
    </script>

</body>

</html>
