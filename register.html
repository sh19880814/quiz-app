<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        新規登録 | 学習クイズアプリ
    </title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 24px;
        }

        .auth-card {
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .auth-card button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 16px;
            min-height: 1.5em;
        }

        .auth-link {
            margin-top: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>
                新規登録
            </h1>

            <div class="auth-field">

                <label for="email">
                    メールアドレス
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required>

            </div>

            <div class="auth-field">

                <label for="password">
                    パスワード
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>

            <button
                id="registerBtn"
                type="button">

                アカウントを作成

            </button>

            <div
                id="message"
                class="auth-message">
            </div>

            <div class="auth-link">

                すでにアカウントをお持ちの方は

                <a href="login.html">
                    ログイン
                </a>

            </div>

        </div>

    </main>


    <!-- Supabase JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- Supabase接続設定 -->

    <script src="auth.js"></script>


    <!-- 新規登録処理 -->

    <script>

        const registerBtn =
            document.getElementById(
                "registerBtn"
            );

        const message =
            document.getElementById(
                "message"
            );


        registerBtn.addEventListener(
            "click",
            async () => {

                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                // ==========================
                // 入力チェック
                // ==========================

                if (
                    !email ||
                    !password
                ) {

                    message.textContent =
                        "メールアドレスとパスワードを入力してください。";

                    return;

                }


                if (
                    password.length < 6
                ) {

                    message.textContent =
                        "パスワードは6文字以上にしてください。";

                    return;

                }


                // ==========================
                // 登録開始
                // ==========================

                message.textContent =
                    "登録中...";

                registerBtn.disabled =
                    true;


                try {

                    // ==========================
                    // メール認証後の戻り先
                    // ==========================

                    const redirectUrl =
                        new URL(
                            "login.html",
                            window.location.href
                        ).href;


                    // ==========================
                    // Supabase 新規登録
                    // ==========================

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signUp({

                                email:
                                    email,

                                password:
                                    password,

                                options: {

                                    emailRedirectTo:
                                        redirectUrl

                                }

                            });


                    // ==========================
                    // エラー
                    // ==========================

                    if (error) {

                        console.error(
                            "登録エラー:",
                            error
                        );

                        message.textContent =
                            "登録に失敗しました: " +
                            error.message;

                        registerBtn.disabled =
                            false;

                        return;

                    }


                    // ==========================
                    // Confirm email OFF の場合
                    // ==========================

                    if (
                        data &&
                        data.session
                    ) {

                        window.location.replace(
                            "index.html"
                        );

                        return;

                    }


                    // ==========================
                    // Confirm email ON の場合
                    // ==========================

                    message.textContent =
                        "確認メールを送信しました。メール内のリンクを開いてから、ログインしてください。";


                    registerBtn.disabled =
                        false;

                }
                catch (error) {

                    console.error(
                        "予期しないエラー:",
                        error
                    );

                    message.textContent =
                        "登録処理中にエラーが発生しました: " +
                        error.message;

                    registerBtn.disabled =
                        false;

                }

            }
        );

    </script>

</body>

</html>
