<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 | 学習クイズアプリ</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 24px;
        }

        .auth-card {
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-description {
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .auth-card button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 16px;
            min-height: 1.5em;
        }

        .auth-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">

            <h1>パスワード再設定</h1>

            <p class="auth-description">
                登録しているメールアドレスを入力してください。
            </p>

            <div class="auth-field">
                <label for="email">メールアドレス</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required>
            </div>

            <button id="resetBtn" type="button">
                再設定メールを送信
            </button>

            <div id="message" class="auth-message"></div>

            <div class="auth-link">
                <a href="login.html">ログイン画面に戻る</a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        const resetBtn =
            document.getElementById("resetBtn");

        const message =
            document.getElementById("message");

        resetBtn.addEventListener(
            "click",
            async () => {

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                if (!email) {
                    message.textContent =
                        "メールアドレスを入力してください.";
                    return;
                }

                message.textContent =
                    "送信中...";

                const redirectUrl =
                    new URL(
                        "reset-password.html",
                        window.location.href
                    ).href;

                const { error } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    redirectUrl
                            }
                        );

                if (error) {
                    console.error(
                        "再設定メールを送信できません",
                        error
                    );

                    message.textContent =
                        "再設定メールの送信に失敗しました。";
                    return;
                }

                message.textContent =
                    "パスワード再設定メールを送信しました。";
            }
        );
    </script>

</body>

</html>
