<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 | 学習クイズアプリ</title>
</head>

<body>

    <h1>パスワード再設定</h1>

<p>
    登録しているメールアドレスを入力してください。
</p>

<div>
    <label for="email">
        メールアドレス
    </label>

    <input
        type="email"
        id="email"
        autocomplete="email"
        required>
</div>

<button
    id="resetBtn"
    type="button">
    再設定メールを送信
</button>

<div id="message"></div>

<p>
    <a href="login.html">
        ログイン画面に戻る
    </a>
</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>

    const resetBtn =
        document.getElementById("resetBtn");

    const message =
        document.getElementById("message");

    resetBtn.addEventListener(
        "click",
        async () => {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            if (!email) {

                message.textContent =
                    "メールアドレスを入力してください。";

                return;

            }

            message.textContent =
                "送信中...";

            const redirectUrl =
                new URL(
                    "reset-password.html",
                    window.location.href
                ).href;

            const { error } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                redirectUrl
                        }
                    );

            if (error) {

                console.error(
                    "再設定メールを送信できません",
                    error
                );

                message.textContent =
                    "再設定メールの送信に失敗しました。";

                return;

            }

            message.textContent =
                "パスワード再設定メールを送信しました。";

        }
    );

</script>


</body>

</html>
