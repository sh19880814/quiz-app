<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワード設定 | 学習クイズアプリ</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 24px;
        }

        .auth-card {
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-description {
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .auth-card button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 16px;
            min-height: 1.5em;
        }

        .auth-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">

            <h1>新しいパスワードを設定</h1>

            <p class="auth-description">
                新しいパスワードを入力してください。
            </p>

            <div class="auth-field">
                <label for="newPassword">新しいパスワード</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="auth-field">
                <label for="confirmPassword">
                    新しいパスワード（確認）
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    required>
            </div>

            <button id="updateBtn" type="button">
                パスワードを変更
            </button>

            <div id="message" class="auth-message"></div>

            <div class="auth-link">
                <a href="login.html">ログイン画面に戻る</a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        const updateBtn =
            document.getElementById("updateBtn");

        const message =
            document.getElementById("message");

        updateBtn.addEventListener(
            "click",
            async () => {

                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;

                if (!newPassword || !confirmPassword) {
                    message.textContent =
                        "パスワードを入力してください。";
                    return;
                }

                if (newPassword !== confirmPassword) {
                    message.textContent =
                        "パスワードが一致していません。";
                    return;
                }

                if (newPassword.length < 6) {
                    message.textContent =
                        "パスワードは6文字以上で入力してください。";
                    return;
                }

                message.textContent =
                    "パスワードを変更中...";

                const { error } =
                    await supabaseClient.auth
                        .updateUser({
                            password:
                                newPassword
                        });

                if (error) {
                    console.error(
                        "パスワードを変更できません",
                        error
                    );

                    message.textContent =
                        "パスワードの変更に失敗しました。";
                    return;
                }

                message.textContent =
                    "パスワードを変更しました。";
            }
        );
    </script>

</body>

</html>
