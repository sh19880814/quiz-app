<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワード設定 | 学習クイズアプリ</title>
</head>

<body>

    <h1>新しいパスワードを設定</h1>

	<p>
	    新しいパスワードを入力してください。
	</p>

	<div>
	    <label for="newPassword">
	        新しいパスワード
	    </label>

	    <input
	        type="password"
	        id="newPassword"
	        autocomplete="new-password"
	        required>
	</div>

	<div>
	    <label for="confirmPassword">
	        新しいパスワード（確認）
	    </label>

	    <input
	        type="password"
	        id="confirmPassword"
	        autocomplete="new-password"
	        required>
	</div>

	<button
	    id="updateBtn"
	    type="button">
	    パスワードを変更
	</button>

	<div id="message"></div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>

    const updateBtn =
        document.getElementById("updateBtn");

    const message =
        document.getElementById("message");

    updateBtn.addEventListener(
        "click",
        async () => {

            const newPassword =
                document
                    .getElementById("newPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            if (!newPassword || !confirmPassword) {

                message.textContent =
                    "パスワードを入力してください。";

                return;

            }

            if (newPassword !== confirmPassword) {

                message.textContent =
                    "パスワードが一致していません。";

                return;

            }

            if (newPassword.length < 6) {

                message.textContent =
                    "パスワードは6文字以上で入力してください。";

                return;

            }

            message.textContent =
                "パスワードを変更中...";

            const { error } =
                await supabaseClient.auth
                    .updateUser({
                        password:
                            newPassword
                    });

            if (error) {

                console.error(
                    "パスワードを変更できません",
                    error
                );

                message.textContent =
                    "パスワードの変更に失敗しました。";

                return;

            }

            message.textContent =
                "パスワードを変更しました。";

        }
    );

</script>

</body>

</html>
