<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>学習クイズアプリ</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="container">

        <!-- ===================== -->
        <!-- スタート画面 -->
        <!-- ===================== -->

        <section id="startScreen">

            <header>

                <h1>学習クイズアプリ</h1>

                <p class="subtitle">

                    個人学習用クイズシステム

                </p>

            </header>

            <!-- 学習統計 -->

            <section
                id="statsArea"
                class="stats-area">

                <h2>学習統計</h2>

                <div class="stats-grid">

                    <div class="stat-card">

                        <div class="stat-title">
                            総回答数
                        </div>

                        <div
                            id="totalAnswer"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            総正解数
                        </div>

                        <div
                            id="totalCorrect"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            総不正解数
                        </div>

                        <div
                            id="totalIncorrect"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            正答率
                        </div>

                        <div
                            id="accuracy"
                            class="stat-value">

                            0%

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            お気に入り
                        </div>

                        <div
                            id="favoriteCount"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            苦手問題
                        </div>

                        <div
                            id="weakCount"
                            class="stat-value">

                            0

                        </div>

                    </div>

                </div>

            </section>

            <!-- 出題設定 -->

            <section class="filter-area">

                <h2>
                    出題設定
                </h2>

                <div class="filter-group">

                    <label for="categoryFilter">
                        カテゴリ
                    </label>

                    <select id="categoryFilter">

                        <option value="">
                            すべて
                        </option>

                    </select>

                </div>

                <div class="filter-group">

                    <label for="tagFilter">
                        試験
                    </label>

                    <select id="tagFilter">

                        <option value="">
                            すべて
                        </option>

                    </select>

                </div>

                <div class="filter-group">

                    <label for="difficultyFilter">
                        難易度
                    </label>

                    <select id="difficultyFilter">

                        <option value="">
                            すべて
                        </option>

                        <option value="1">
                            ★1 初級
                        </option>

                        <option value="2">
                            ★2 初中級
                        </option>

                        <option value="3">
                            ★3 中級
                        </option>

                        <option value="4">
                            ★4 上級
                        </option>

                        <option value="5">
                            ★5 最難関
                        </option>

                    </select>

                </div>

                <div class="checkbox-area">

                    <label>

                        <input
                            type="checkbox"
                            id="favoriteOnly">

                        お気に入りのみ

                    </label>

                </div>

                <div class="checkbox-area">

                    <label>

                        <input
                            type="checkbox"
                            id="incorrectOnly">

                        苦手問題のみ

                    </label>

                </div>

                <div class="quiz-mode">

                    <h3>
                        出題モード
                    </h3>

                    <label>

                        <input
                            type="radio"
                            name="quizMode"
                            value="normal"
                            checked>

                        通常学習

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="quizMode"
                            value="exam">

                        模擬試験（20問）

                    </label>

                </div>

                <button id="startBtn">

                    学習開始

                </button>

            </section>

        </section>

        <!-- ===================== -->
        <!-- クイズ画面 -->
        <!-- ===================== -->

        <section
            id="quizScreen"
            style="display:none;">

            <div class="quiz-header">

                <div
                    id="category"
                    class="category">

                    カテゴリ

                </div>

                <div
                    id="difficulty"
                    class="difficulty">

                    難易度

                </div>

            </div>

            <div
                id="questionCounter"
                class="question-counter">

                0 / 0

            </div>

            <div
                id="totalQuestionCount"
                class="question-count">

                登録問題数 : 0問

            </div>

            <h2
                id="question"
                class="question">

                問題文

            </h2>

            <div
                id="choices"
                class="choices">

            </div>

            <div
                id="result"
                class="result">

            </div>

            <div
                id="explanation"
                class="explanation">

            </div>

            <div class="button-group">

                <button id="favoriteBtn">

                    ☆ お気に入り

                </button>

                <button id="nextBtn">

                    次の問題

                </button>

            </div>

        </section>

        <!-- ===================== -->
        <!-- 終了画面 -->
        <!-- ===================== -->

        <section
            id="finishScreen"
            style="display:none;">

            <h2>

                学習完了！お疲れさまでした！

            </h2>

            <div
                id="finishResult">

            </div>

            <button
                id="restartBtn">

                もう一度学習する

            </button>

            <button
                id="returnHomeBtn">

                スタート画面へ戻る

            </button>

        </section>

        <!-- フッター -->

        <footer>

            <hr>

            <small>

                Personal Quiz System

            </small>

        </footer>

    </div>

    <script src="questions.js"></script>

    <script src="script.js"></script>

</body>

</html>
